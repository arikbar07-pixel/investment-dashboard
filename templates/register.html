<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרשמה — ההשקעות שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }
    .logo { font-size: 36px; margin-bottom: 10px; text-align: center; }
    h1 { font-size: 20px; font-weight: 700; color: #f0f6fc; margin-bottom: 4px; text-align: center; }
    .sub { font-size: 13px; color: #8b949e; margin-bottom: 28px; text-align: center; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 10px 13px;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #4493f8; }
    input.invalid { border-color: #f85149; }
    .hint { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .btn {
      margin-top: 20px;
      width: 100%;
      background: #3fb950;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .88; }
    .error { margin-top: 14px; color: #f85149; font-size: 13px; text-align: center; }
    .switch { margin-top: 20px; text-align: center; font-size: 13px; color: #8b949e; }
    .switch a { color: #4493f8; text-decoration: none; }
    .switch a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📈</div>
    <h1>הרשמה</h1>
    <p class="sub">צור חשבון חדש</p>
    <form method="post" onsubmit="return validate()">
      <div class="field">
        <label for="username">שם משתמש</label>
        <input type="text" id="username" name="username" autofocus autocomplete="username" placeholder="לפחות 3 תווים">
        <div class="hint">3 תווים לפחות, אותיות ומספרים</div>
      </div>
      <div class="field">
        <label for="password">סיסמה</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="לפחות 6 תווים">
      </div>
      <div class="field">
        <label for="confirm">אישור סיסמה</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="הכנס סיסמה שוב">
      </div>
      <button type="submit" class="btn">הרשמה</button>
    </form>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <p class="switch">כבר יש לך חשבון? <a href="/login">כנס כאן</a></p>
  </div>
  <script>
    function validate() {
      var p = document.getElementById('password').value;
      var c = document.getElementById('confirm').value;
      if (p !== c) {
        document.getElementById('confirm').classList.add('invalid');
        alert('הסיסמאות אינן תואמות');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כניסה — ההשקעות שלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
    }
    .logo { font-size: 36px; margin-bottom: 10px; text-align: center; }
    h1 { font-size: 20px; font-weight: 700; color: #f0f6fc; margin-bottom: 4px; text-align: center; }
    .sub { font-size: 13px; color: #8b949e; margin-bottom: 24px; text-align: center; }
    /* Mode picker */
    .mode-label { font-size: 11px; font-weight: 700; color: #8b949e; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
    .mode-row { display: flex; gap: 10px; margin-bottom: 24px; }
    .mode-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 14px 10px;
      background: #21262d;
      border: 2px solid #30363d;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .18s, background .18s;
      color: #8b949e;
      font-family: inherit;
    }
    .mode-btn .icon { font-size: 26px; }
    .mode-btn .label { font-size: 13px; font-weight: 600; }
    .mode-btn.selected { border-color: #4493f8; background: rgba(68,147,248,.1); color: #f0f6fc; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #21262d;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 10px 13px;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #4493f8; }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #8b949e;
    }
    .remember input[type="checkbox"] { accent-color: #4493f8; width: 15px; height: 15px; cursor: pointer; }
    .btn {
      margin-top: 20px;
      width: 100%;
      background: #4493f8;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .88; }
    .error { margin-top: 14px; color: #f85149; font-size: 13px; text-align: center; }
    .switch { margin-top: 20px; text-align: center; font-size: 13px; color: #8b949e; }
    .switch a { color: #4493f8; text-decoration: none; }
    .switch a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📈</div>
    <h1>ההשקעות שלי</h1>
    <p class="sub">כנס לחשבון שלך</p>

    <div class="mode-label">בחר מצב תצוגה</div>
    <div class="mode-row">
      <button type="button" class="mode-btn" id="mode-mobile" onclick="pickMode('mobile')">
        <span class="icon">📱</span>
        <span class="label">טלפון</span>
      </button>
      <button type="button" class="mode-btn" id="mode-desktop" onclick="pickMode('desktop')">
        <span class="icon">💻</span>
        <span class="label">מחשב</span>
      </button>
    </div>

    <form method="post">
      <div class="field">
        <label for="username">שם משתמש</label>
        <input type="text" id="username" name="username" autofocus autocomplete="username" placeholder="שם המשתמש שלך">
      </div>
      <div class="field">
        <label for="password">סיסמה</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <label class="remember">
        <input type="checkbox" name="remember" value="1">
        זכור אותי
      </label>
      <button type="submit" class="btn">כניסה</button>
    </form>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <p class="switch">אין לך חשבון? <a href="/register">הירשם כאן</a></p>
  </div>
  <script>
    function pickMode(mode) {
      localStorage.setItem('viewMode', mode);
      document.getElementById('mode-mobile').classList.toggle('selected', mode === 'mobile');
      document.getElementById('mode-desktop').classList.toggle('selected', mode === 'desktop');
    }
    // Restore saved choice
    // Default: phone-sized screens start in mobile mode
    var saved = localStorage.getItem('viewMode') ||
      (window.matchMedia('(max-width: 768px)').matches ? 'mobile' : 'desktop');
    pickMode(saved);
  </script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד השקעות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2e62f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EquityFlow">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>

  <!-- Ambient glow -->
  <div class="ambient-bg"></div>

  <!-- ═══ TOP NAV ══════════════════════════════════════════════════════════ -->
  <nav class="top-nav">
    <div class="nav-brand">
      <span class="nav-logo">📈</span>
      <span class="nav-title">EquityFlow</span>
    </div>

    <div class="nav-status">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">מתחבר...</span>
    </div>

    <div class="nav-end">
      <div class="clock" id="clock"></div>
      <button class="btn-add-nav" onclick="toggleForm()">
        <span class="material-symbols-outlined" style="font-size:17px;vertical-align:-3px;margin-left:4px">add</span>
        הוסף נכס
      </button>
    </div>
  </nav>

  <!-- ═══ SIDEBAR ══════════════════════════════════════════════════════════ -->
  <aside class="sidebar">
    <div class="sidebar-label">קטגוריות</div>
    <div class="sidebar-nav" id="tabs-bar"></div>
    <div class="sidebar-bottom">
      <a href="/logout" class="btn-logout">
        <span class="material-symbols-outlined" style="font-size:17px">logout</span>
        התנתקות
      </a>
    </div>
  </aside>

  <!-- ═══ MAIN ═════════════════════════════════════════════════════════════ -->
  <main class="main-layout">

    <!-- Summary cards -->
    <div class="summary-grid">
      <div class="glass-card stat-item anim-in" style="animation-delay:.05s">
        <span class="stat-label">סה"כ הושקע</span>
        <span class="stat-value" id="stat-invested">—</span>
      </div>
      <div class="glass-card stat-item anim-in" style="animation-delay:.10s">
        <span class="stat-label">שווי נוכחי</span>
        <span class="stat-value val-primary" id="stat-current">—</span>
      </div>
      <div class="glass-card stat-item anim-in" style="animation-delay:.15s">
        <span class="stat-label">רווח / הפסד</span>
        <span class="stat-value" id="stat-pnl">—</span>
      </div>
      <div class="glass-card stat-item anim-in" style="animation-delay:.20s">
        <span class="stat-label">תשואה כוללת</span>
        <span class="stat-value" id="stat-return">—</span>
      </div>
      <div class="glass-card stat-item anim-in" style="animation-delay:.25s">
        <span class="stat-label">$/₪</span>
        <span class="stat-value" id="stat-rate">—</span>
      </div>
    </div>

    <!-- Main content card -->
    <div class="content-card glass-card anim-in" style="animation-delay:.35s">
      <div id="main-content">
        <div class="spinner">⟳ טוען נתונים...</div>
      </div>
    </div>

    <!-- Chart Panel -->
    <div class="chart-panel glass-card" id="chart-panel" style="display:none">
      <div class="chart-top">
        <div class="chart-info">
          <span class="chart-ticker-label" id="chart-ticker"></span>
          <span class="chart-price-label"  id="chart-price"></span>
          <span class="chart-change-label" id="chart-change"></span>
        </div>
        <div class="chart-controls">
          <div class="range-group">
            <button class="range-btn" data-range="1d"  onclick="loadChart('1d')">יומי</button>
            <button class="range-btn" data-range="7d"  onclick="loadChart('7d')">שבוע</button>
            <button class="range-btn active" data-range="1mo" onclick="loadChart('1mo')">חודש</button>
            <button class="range-btn" data-range="3mo" onclick="loadChart('3mo')">3 חודשים</button>
            <button class="range-btn" data-range="1y"  onclick="loadChart('1y')">שנה</button>
          </div>
          <div class="range-group">
            <button class="range-btn active" data-type="line"   onclick="setChartType('line')">קו</button>
            <button class="range-btn"        data-type="candle" onclick="setChartType('candle')">נרות</button>
          </div>
          <button class="btn-close" onclick="closeChart()">✕</button>
        </div>
      </div>
      <div class="chart-body">
        <div id="tv-chart"></div>
      </div>
      <div id="news-section" style="padding:0 18px 18px;display:none">
        <div class="news-section-label">חדשות רלוונטיות</div>
        <div id="news-list"></div>
      </div>
    </div>

  </main>

  <!-- ═══ SLIDE-IN FORM PANEL ══════════════════════════════════════════════ -->
  <div class="form-panel" id="form-panel">
    <div class="form-panel-topbar">
      <span class="form-panel-title">הוספת נכס חדש</span>
      <button class="form-close-btn" onclick="toggleForm()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div id="form-body" class="form-slide-body">

      <div class="form-slide-field">
        <label>טיקר</label>
        <div class="ac-wrap">
          <input type="text" id="f-ticker" placeholder="AAPL, BTC-USD..." autocomplete="off" spellcheck="false">
          <div class="ac-list" id="ac-list"></div>
        </div>
        <div class="field-hint" id="f-name-hint"></div>
      </div>

      <div class="form-slide-field">
        <label>תאריך קנייה</label>
        <input type="date" id="f-date">
      </div>

      <div class="form-slide-field">
        <label>סכום</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" id="f-amount" placeholder="0.00" step="0.01" min="0" style="flex:1">
          <select id="f-currency" class="cur-select">
            <option value="USD">$</option>
            <option value="ILS">₪</option>
          </select>
        </div>
      </div>

      <div class="form-slide-field">
        <label>קטגוריה</label>
        <select id="f-cat"></select>
      </div>

      <div class="form-preview" id="form-preview"></div>

      <button class="btn-add btn-add-full" onclick="addInvestment()">הוסף לתיק</button>

    </div>
  </div>

  <!-- Backdrop overlay -->
  <div id="form-overlay" onclick="toggleForm()"></div>

  <!-- ═══ MOBILE BOTTOM NAV ════════════════════════════════════════════════ -->
  <nav class="mobile-nav" id="mobile-nav"></nav>

  <script src="/static/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
